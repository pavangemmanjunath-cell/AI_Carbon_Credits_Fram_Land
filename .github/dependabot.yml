# Dependabot version updates.
#
# - Weekly, Monday morning (Europe/Berlin). Minor and patch updates are grouped so that
#   reviewers see a few pull requests, not dozens. Major updates arrive one by one.
# - Labels must exist in .github/labels.yml.
# - Python: requirements.txt is the pinned set (the Docker image and CI install it).
# - The map stack is grouped on its own because those packages move together. A
#   dependency joins the first group that matches it, so that group comes first.
# - Docker: the Dockerfiles in infra/docker and the images in docker-compose.yml.
# - Security advisories open their own pull requests regardless of this schedule.
version: 2
updates:
  - package-ecosystem: pip
    directory: "/"
    schedule:
      interval: weekly
      day: monday
      time: "06:00"
      timezone: Europe/Berlin
    open-pull-requests-limit: 10
    labels: [dependencies, area/api]
    commit-message:
      prefix: "chore(deps-py)"
    groups:
      python-minor-patch:
        update-types: ["minor", "patch"]

  - package-ecosystem: npm
    directory: "/apps/web"
    schedule:
      interval: weekly
      day: monday
      time: "06:30"
      timezone: Europe/Berlin
    open-pull-requests-limit: 10
    labels: [dependencies, area/web]
    commit-message:
      prefix: "chore(deps-web)"
    groups:
      map-stack:
        patterns: ["maplibre-gl", "pmtiles", "terra-draw*"]
      web-minor-patch:
        update-types: ["minor", "patch"]

  - package-ecosystem: github-actions
    directory: "/"
    schedule:
      interval: weekly
      day: monday
      time: "07:00"
      timezone: Europe/Berlin
    labels: [dependencies, area/infra]
    commit-message:
      prefix: "chore(deps-actions)"
    groups:
      actions-minor-patch:
        update-types: ["minor", "patch"]

  - package-ecosystem: docker
    directory: "/infra/docker"
    schedule:
      interval: weekly
      day: monday
      time: "07:30"
      timezone: Europe/Berlin
    labels: [dependencies, area/infra]
    commit-message:
      prefix: "chore(deps-docker)"
    groups:
      docker-minor-patch:
        update-types: ["minor", "patch"]
    ignore:
      # Python 3.12 is the supported baseline (pyproject.toml) and Node 22 the targeted LTS
      # (apps/web engines). Change a base image's language version on purpose, together with
      # CI and the docs, not through a grouped update.
      - dependency-name: "python"
        update-types: ["version-update:semver-major", "version-update:semver-minor"]
      - dependency-name: "node"
        update-types: ["version-update:semver-major"]

  # Images in docker-compose.yml (postgis, minio) at the repository root.
  - package-ecosystem: docker-compose
    directory: "/"
    schedule:
      interval: weekly
      day: monday
      time: "08:00"
      timezone: Europe/Berlin
    labels: [dependencies, area/infra]
    commit-message:
      prefix: "chore(deps-compose)"
    groups:
      compose-minor-patch:
        update-types: ["minor", "patch"]
