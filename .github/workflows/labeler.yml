name: Labeler

# Applies area labels to pull requests from the paths they touch.
# Configuration: .github/labeler.yml — label names must exist (see .github/labels.yml).

on:
  pull_request_target:
    types: [opened, synchronize, reopened]

permissions:
  contents: read
  pull-requests: write

jobs:
  label:
    name: Apply path-based labels
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: actions/labeler
        uses: actions/labeler@v5
        with:
          configuration-path: .github/labeler.yml
          sync-labels: false
