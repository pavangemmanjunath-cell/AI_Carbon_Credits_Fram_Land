name: Security

# Static analysis, dependency audits and secret scanning.
# Runs on every pull request, on pushes to main and once a week (new advisories
# appear even when the code does not change).
# Job names are referenced by branch protection (infra/github/README.md).

on:
  push:
    branches: [main]
  pull_request:
  schedule:
    # Weekly, Monday 05:17 UTC (off the hour to avoid queue peaks)
    - cron: "17 5 * * 1"
  workflow_dispatch:

concurrency:
  group: security-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

permissions:
  contents: read

jobs:
  codeql:
    name: CodeQL (${{ matrix.language }})
    runs-on: ubuntu-latest
    timeout-minutes: 45
    permissions:
      contents: read
      security-events: write
      actions: read
    strategy:
      fail-fast: false
      matrix:
        include:
          - language: python
            build-mode: none
          - language: javascript-typescript
            build-mode: none
    steps:
      - name: Check out
        uses: actions/checkout@v4

      - name: Initialize CodeQL
        uses: github/codeql-action/init@v3
        with:
          languages: ${{ matrix.language }}
          build-mode: ${{ matrix.build-mode }}
          queries: security-and-quality

      - name: Analyze
        uses: github/codeql-action/analyze@v3
        with:
          category: "/language:${{ matrix.language }}"

  pip-audit:
    name: pip-audit (Python dependencies)
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Check out
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: requirements.txt

      - name: Install pip-audit
        run: python -m pip install pip-audit

      - name: Audit pinned requirements
        # requirements.txt is the pinned set that the Docker image installs.
        # --strict fails on packages that cannot be audited; known vulnerabilities fail the job.
        run: python -m pip_audit -r requirements.txt --strict --progress-spinner off

  npm-audit:
    name: npm audit (web dependencies)
    runs-on: ubuntu-latest
    timeout-minutes: 15
    defaults:
      run:
        working-directory: apps/web
    steps:
      - name: Check out
        uses: actions/checkout@v4

      - name: Set up Node 22
        uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: apps/web/package-lock.json

      # --ignore-scripts: auditing never needs to run install scripts of dependencies.
      - name: npm ci
        run: npm ci --ignore-scripts

      - name: npm audit (high and critical fail the job)
        run: npm audit --audit-level=high

  gitleaks:
    name: gitleaks (secret scanning)
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: read
      pull-requests: read
    steps:
      - name: Check out (full history for scanning)
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Run gitleaks
        uses: gitleaks/gitleaks-action@v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          # GITLEAKS_LICENSE is only required for organization accounts:
          # https://github.com/gitleaks/gitleaks-action#environment-variables
          GITLEAKS_LICENSE: ${{ secrets.GITLEAKS_LICENSE }}

  # Compares the dependency manifests of a pull request with its base branch
  # (requirements.txt, apps/web/package-lock.json, workflow action versions) and
  # fails when the change adds a package with a known high or critical advisory.
  # Needs the dependency graph, which is on by default for public repositories.
  # Licenses are not gated here: a reviewer checks docs/licensing/THIRD_PARTY.md
  # when a dependency is added.
  dependency-review:
    name: Dependency review (pull requests)
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
    steps:
      - name: Check out
        uses: actions/checkout@v4

      - name: Review dependency changes
        uses: actions/dependency-review-action@v4
        with:
          fail-on-severity: high
          comment-summary-in-pr: never
