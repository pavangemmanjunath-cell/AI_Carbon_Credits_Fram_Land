# AgriCarbon Atlas — nginx server block for the static web app.
#
# This file is copied into the image as /etc/nginx/templates/default.conf.template.
# At container start the official nginx image runs envsubst on it and writes
# /etc/nginx/conf.d/default.conf. Only the variables listed below are
# substituted; nginx's own $uri/$host variables are left untouched because the
# entrypoint restricts substitution to defined environment variables.
#
#   NGINX_PORT               listen port (default 8080)
#   ATLAS_API_ORIGIN         origin of the FastAPI service, e.g. https://api.example.org
#   ATLAS_BASEMAP_ORIGINS    space-separated origins for style JSON, glyphs, sprites,
#                            vector/raster tiles and PMTiles, e.g.
#                            "https://tiles.example.org https://demotiles.maplibre.org"
#   ATLAS_EXTRA_CONNECT_SRC  additional connect-src origins (e.g. a terrain tile host)
#   ATLAS_EXTRA_IMG_SRC      additional img-src origins (e.g. a satellite XYZ host)
#
# How to adjust the Content Security Policy
# - API on another host: set ATLAS_API_ORIGIN (connect-src).
# - Your own PMTiles bucket / CDN: add it to ATLAS_BASEMAP_ORIGINS. PMTiles are
#   fetched with HTTP Range requests via fetch(), so the bucket needs CORS with
#   `Access-Control-Allow-Origin` and `Access-Control-Expose-Headers: ETag, Content-Range`.
# - Satellite or terrain raster tiles: add the host to ATLAS_EXTRA_IMG_SRC
#   (MapLibre loads raster tiles as images) and, for terrain-RGB decoded in
#   workers, also to ATLAS_EXTRA_CONNECT_SRC.
# - Fonts are self-hosted (@fontsource, OFL), so no external font origins are allowed.
# - Satellite view: MapLibre fetches raster tiles with fetch(), so imagery hosts must be
#   in connect-src as well as img-src. The image defaults of ATLAS_EXTRA_IMG_SRC and
#   ATLAS_EXTRA_CONNECT_SRC list the imagery hosts from
#   config/imagery/providers.yaml (USGS, IGN France, IGN Spain, PDOK, EOX, Esri).
#   Remove the ones you do not use; add your own provider's host when you add one.
# - Do not add 'unsafe-eval'. Neither MapLibre GL nor React require it. If a future dependency ships WebAssembly, add 'wasm-unsafe-eval'
#   to script-src rather than 'unsafe-eval'.
# - Behind TLS termination, add Strict-Transport-Security at the terminator or
#   uncomment the HSTS line below.
#
# Note on nginx semantics: `add_header` directives in a location block REPLACE
# all inherited add_header directives. Locations below therefore use only
# `expires`/`try_files`, never add_header, so the security headers always apply.

server {
    listen ${NGINX_PORT};
    listen [::]:${NGINX_PORT};
    server_name _;

    root /usr/share/nginx/html;
    index index.html;

    # ----------------------------------------------------------- security headers
    add_header Content-Security-Policy "default-src 'self'; script-src 'self'; style-src 'self' 'unsafe-inline'; font-src 'self' data:; img-src 'self' data: blob: ${ATLAS_BASEMAP_ORIGINS} ${ATLAS_EXTRA_IMG_SRC}; connect-src 'self' ${ATLAS_API_ORIGIN} ${ATLAS_BASEMAP_ORIGINS} ${ATLAS_EXTRA_CONNECT_SRC}; worker-src 'self' blob:; child-src 'self' blob:; media-src 'self' blob:; manifest-src 'self'; object-src 'none'; base-uri 'self'; form-action 'self'; frame-ancestors 'none'; upgrade-insecure-requests" always;
    add_header X-Frame-Options "DENY" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    add_header Permissions-Policy "geolocation=(self), camera=(), microphone=(), payment=(), usb=()" always;
    add_header Cross-Origin-Opener-Policy "same-origin" always;
    add_header Cross-Origin-Resource-Policy "same-origin" always;
    add_header X-Permitted-Cross-Domain-Policies "none" always;
    # add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;

    server_tokens off;

    # ------------------------------------------------------------- compression
    gzip on;
    gzip_vary on;
    gzip_comp_level 5;
    gzip_min_length 1024;
    gzip_proxied any;
    gzip_types
        text/plain text/css text/javascript application/javascript application/json
        application/geo+json application/manifest+json image/svg+xml
        application/vnd.mapbox-vector-tile font/woff2;

    # ---------------------------------------------------------------- probes
    location = /healthz {
        default_type text/plain;
        return 200 "ok\n";
    }

    # ------------------------------------------- hashed build assets (immutable)
    location /assets/ {
        expires 1y;
        access_log off;
        try_files $uri =404;
    }

    # ---------- optional locally bundled PMTiles / GeoJSON (range requests on)
    location ~* \.(pmtiles)$ {
        gzip off;
        expires 7d;
        try_files $uri =404;
    }

    location ~* \.(geojson|json)$ {
        expires 1h;
        try_files $uri =404;
    }

    # ------------------------------------------------------ SPA entry point
    location = /index.html {
        expires -1;
    }

    location / {
        try_files $uri $uri/ /index.html;
    }

    # Never serve dotfiles or source maps from the image.
    location ~ /\. {
        deny all;
    }
    location ~* \.map$ {
        deny all;
    }
}
