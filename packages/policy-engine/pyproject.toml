[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "agricarbon-policy-engine"
version = "0.2.0"
description = "Programme screening rules (config/policies) for AgriCarbon Atlas — screening, never eligibility"
readme = "README.md"
requires-python = ">=3.12"
license = {text = "Apache-2.0"}
dependencies = ["PyYAML>=6"]

[tool.setuptools.packages.find]
include = ["policy_engine*"]
