[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "carboncreditbuy-geo-engine"
version = "0.2.0"
description = "Geometry validation and construction, land-cover, Sentinel-2 indices, climate zones, the vegetation cube, file imports, point-cloud tree detection and tree-cover detection for CarbonCreditBuy"
readme = "README.md"
requires-python = ">=3.12"
license = {text = "Apache-2.0"}
dependencies = ["shapely>=2", "pyproj>=3.6", "numpy>=1.26", "pyyaml>=6"]

[project.optional-dependencies]
live = ["rasterio>=1.3", "pystac-client>=0.7"]
imports = ["laspy[lazrs]>=2.5", "defusedxml>=0.7"]
e57 = ["pye57"]

[tool.setuptools.packages.find]
include = ["geo_engine*"]
