[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "carboncreditbuy-carbon-engine"
version = "1.1.1"
description = "Deterministic, parameter-cited carbon removal scenario models for CarbonCreditBuy"
readme = "README.md"
requires-python = ">=3.12"
license = {text = "Apache-2.0"}
dependencies = ["PyYAML>=6"]

[tool.setuptools.packages.find]
include = ["carbon_engine*"]
