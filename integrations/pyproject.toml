[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "carboncreditbuy-integrations"
version = "1.1.1"
description = "External data adapters (with offline demo twins) for CarbonCreditBuy"
readme = "README.md"
requires-python = ">=3.12"
license = {text = "Apache-2.0"}
dependencies = ["httpx>=0.27", "numpy>=1.26", "shapely>=2"]

[project.optional-dependencies]
live = ["rasterio>=1.3", "pystac-client>=0.7"]

[tool.setuptools.packages.find]
include = ["carboncreditbuy_integrations*"]
