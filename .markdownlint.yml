# markdownlint configuration (used by .github/workflows/docs.yml and `make docs-lint`)
# Rule reference: https://github.com/DavidAnson/markdownlint/blob/main/doc/Rules.md
default: true

# Prose wraps at ~80 columns, but tables, links and code are exempt.
MD013:
  line_length: 120
  code_blocks: false
  tables: false
  headings: false

# Allow the same heading text in different sections (e.g. "Sources" per region).
MD024:
  siblings_only: true

# Inline HTML is used sparingly for <details> and <sup>.
MD033:
  allowed_elements: [details, summary, sup, sub, br, kbd, img]

# First line may be a frontmatter-less H1 or a badge line.
MD041: false

# Bare URLs are acceptable inside tables and reference lists.
MD034: false

# Ordered lists may use incrementing numbers.
MD029:
  style: ordered
