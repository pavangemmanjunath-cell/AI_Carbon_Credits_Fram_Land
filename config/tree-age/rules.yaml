    summary: >-
      Delhi tree-felling permissions carry a condition to plant 10 saplings for each tree felled and to maintain them for 5 to 7 years.
    details: >-
      Circular No. FAWL-L/3/2023-Tree Cell, I/76547/2023 dated 2 June 2023 states that Tree Officers grant felling permission under section 9 of the Delhi Preservation of Trees Act, 1994 'on conditions ... one of them being plantation of 10 saplings for each tree felled and maintaining the same for 5-7 years'. Applications must give the girth at 1.85 m above ground and the Tree Officer decides within sixty days. The circular directs Tree Officers to act under sections 11, 12 and 31 against non-compliance and to plant using forfeited security deposits. The ratio does not depend on the age of the tree.
