  - id: eu-de-berlin-baumschutzverordnung
    scope: EU
    country: DE
    subdivision: DE-BE
    locality: "Berlin"
    name: "Berliner Baumschutzverordnung (BaumSchVO)"
    authority: "Land Berlin: Umwelt- und Naturschutzämter of the district offices"
    category: tree-protection
    applies_to: {min_age_years: null, max_age_years: null, trees: existing, setting: urban}
    outcome_for_existing_trees: protected
    summary: >-
      Example: in Berlin, deciduous trees (except fruit trees), Scots pines, walnuts and Turkish hazels are protected once the trunk circumference is 80 cm at 1.30 m height, or 50 cm on at least one stem of a multi-stem tree; the test is size, not age.
    details: >-
      Protected are all deciduous trees except fruit trees, Scots pine (Pinus sylvestris) and, among fruit trees, walnut and Turkish hazel; a single-stem tree needs a trunk circumference of at least 80 cm and a multi-stem tree at least one stem of 50 cm, measured at 130 cm above the ground (directly under the crown if it starts lower). Felling, significant pruning and root interventions need an exemption permit, which the district office can grant only in the cases listed in section 5 of the ordinance and usually with conditions for replacement planting (Ersatzpflanzung) or a compensation payment (Ausgleichszahlung). Newly planted replacement trees are protected whatever their circumference.
    amount: null
    status: in-force
    is_example: true
    sources:
