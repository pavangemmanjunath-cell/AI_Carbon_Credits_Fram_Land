  # ------------------------------------------------------------------ EUROPEAN UNION
  - id: eu-crcf-regulation-2024-3012
    scope: EU
    country: null
    subdivision: null
    locality: null
    name: "Regulation (EU) 2024/3012 (CRCF): carbon farming, quantification, baseline and additionality"
    authority: "European Union: European Commission and recognised certification schemes"
    category: carbon-credit-eligibility
    applies_to: {min_age_years: null, max_age_years: null, trees: any, setting: any}
    outcome_for_existing_trees: conditional
    summary: >-
      Under the EU's voluntary certification framework only net removals above a baseline from an activity lasting at least five years can be certified, and the activity must go beyond legal requirements and need the certification incentive.
    details: >-
      Article 2(10) defines carbon farming as 'any practice or process carried out over an activity period of at least five years, related to the management of a terrestrial or coastal environment' that results in carbon storage or lower soil emissions. Article 4 calculates the net carbon-farming benefit by subtracting baseline removals and associated emissions from total removals, preferring standardised baselines 'highly representative of the standard performance of comparable practices'. Article 5(1) requires that the activity goes 'beyond Union and national statutory requirements at the level of an individual operator' and needs 'the incentive effect of the certification' to be financially viable, and Article 5(2) presumes additionality when a standardised baseline is used. Article 6 requires monitoring for at least the activity period, with operators liable for releases during monitoring.
    amount: null
    status: in-force
    is_example: false
    sources:
      - {title: "Regulation (EU) 2024/3012 establishing a Union certification framework for permanent carbon removals, carbon farming and carbon storage in products", publisher: "EUR-Lex (Official Journal of the European Union)", url: "https://eur-lex.europa.eu/legal-content/EN/TXT/HTML/?uri=OJ:L_202403012", accessed: "2026-10-05"}
    verification_status: verified
    notes: >-
      The Regulation text read does not address existing carbon stocks explicitly; treating them as part of the baseline follows from Article 4's net-benefit formula. An Atlas estimate is never automatically CRCF-certifiable: certification by a recognised scheme is required. Article references were read through a page-summarising tool.

