  - id: us-car-forest-protocol-ifm
    scope: US
    country: US
    subdivision: null
    locality: null
    name: "Climate Action Reserve U.S. Forest Protocol v5.1: Improved Forest Management"
    authority: "Climate Action Reserve"
    category: carbon-credit-eligibility
    applies_to: {min_age_years: null, max_age_years: null, trees: existing, setting: forest}
    outcome_for_existing_trees: conditional
    summary: >-
      Improved Forest Management credits only the extra carbon an existing forest holds compared with a baseline, not the carbon it already stores, and requires 100 years of monitoring.
    details: >-
      Eligible project types are reforestation, improved forest management (activities that 'maintain or increase carbon stocks on forested land relative to baseline levels') and avoided conversion (Section 2.1); IFM must be on land with more than ten percent tree canopy cover and use natural forest management practices (Sections 2.1.2 and 3.9.2). Credits are based on actual onsite carbon stocks minus baseline estimates (Section 6), so existing standing carbon is not credited in itself, and projects must go above and beyond what compliance with any federal, state or local law would deliver (Section 3.3.1). Project operators must monitor and verify for 100 years after issuance of any credit, the baseline is assumed valid for 100 years, and a buffer pool covers reversals (Sections 3.5, 3.4 and 7.2).
    amount: null
    status: in-force
    is_example: false
    sources:
      - {title: "U.S. Forest Protocol, Version 5.1", publisher: "Climate Action Reserve", url: "https://climateactionreserve.org/wp-content/uploads/2023/07/Final_Forest_Protocol_V5.1_7.14.2023.pdf", accessed: "2026-10-05"}
    verification_status: verified
    notes: >-
      Version 5.1 (July 2023 file). Newer versions were not checked. Section numbers were read through a page-summarising tool; confirm against the PDF before quoting.

  - id: us-acr-ifm-non-federal-v2-1
