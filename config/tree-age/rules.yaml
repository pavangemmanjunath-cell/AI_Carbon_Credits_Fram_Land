  - id: us-cfc-preservation-protocol
    scope: US
    country: US
    subdivision: null
    locality: null
    name: "City Forest Credits Preservation Protocol, version 14.40 (40-year)"
    authority: "City Forest Credits (Urban Forest Carbon Registry), a nonprofit urban-forest carbon registry"
    category: carbon-credit-eligibility
    applies_to: {min_age_years: null, max_age_years: null, trees: existing, setting: urban}
    outcome_for_existing_trees: conditional
    summary: >-
      City Forest Credits can credit the carbon already stored in an existing urban forest stand that is at risk of being cleared, if the owner commits to preserve it for 40 years.
    details: >-
      Version 14.40 (10 August 2026) covers 'at-risk forested stands' with at least 80% tree canopy where precipitation is 20 inches a year or more, or 60% where it is less (Section 1.4.C); existing carbon stock is quantified for trees at least 5 inches in diameter at breast height (Section 11.1.B) and stand age is established from documentation or tree coring (Section 11.1.A.ii). The stand must show risk of conversion by one of three tests (at least 30% of its perimeter bordering non-forest, developed or improved uses; a sale or assessed value above USD 8,000 per acre within three years; or a higher value in non-forest use) (Section 4.4) and must not already be protected by a recorded encumbrance (Section 4.2). The project duration is 40 years including the preservation commitment (Section 2.2) and 10% of credits go to the registry reversal pool (Section 11.4).
    amount: null
    status: in-force
    is_example: false
    sources:
      - {title: "Preservation Protocol v14.40 (40-year)", publisher: "City Forest Credits", url: "https://www.cityforestcredits.org/wp-content/uploads/2026/08/CFC-Preservation-Protocol-v14.40.pdf", accessed: "2026-10-05"}
      - {title: "Carbon protocols (current versions)", publisher: "City Forest Credits", url: "https://www.cityforestcredits.org/carbon-protocols/", accessed: "2026-10-05"}
    verification_status: verified
    notes: >-
      This is avoided loss of existing stock, not new removals, and quantification applies deductions (an 80% factor with the USFS tables method, one standard error with inventory methods). Growth after the initial crediting period is credited only through updated documentation and verification (Section 11.6). A 100-year version (v14.100) is listed on the protocols page but was not opened.

