  - id: eu-old-growth-forests-guidelines
    scope: EU
    country: null
    subdivision: null
    locality: null
    name: "Guidelines for defining, mapping, monitoring and strictly protecting EU primary and old-growth forests (SWD(2023) 62 final)"
    authority: "European Commission (DG Environment)"
    category: tree-protection
    applies_to: {min_age_years: null, max_age_years: null, trees: existing, setting: forest}
    outcome_for_existing_trees: conditional
    summary: >-
      Non-binding EU guidance tells Member States how to identify and strictly protect old-growth forests using structural indicators such as old or large trees and deadwood; it sets no numeric tree-age threshold.
    details: >-
      Section 2.3 (p. 7) defines old-growth forest as 'A forest stand or area consisting of native tree species that have developed, predominantly through natural processes, structures and dynamics normally associated with late-seral developmental phases in primary or undisturbed forests of the same type.' Section 3.2 lists seven indicators (three main, four complementary); the main ones include native species composition, a high proportion and diversity of standing and lying deadwood, and the 'presence of old or large trees, some of which may reach the maximum age known for the species'. The guidelines contain no numerical age threshold and are 'voluntary and not prescriptive', not a binding condition for state aid or EU funding.
    amount: null
    status: in-force
    is_example: false
    sources:
