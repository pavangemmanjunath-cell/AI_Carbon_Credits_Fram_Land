# Tree-age rules: which real programmes and laws treat trees differently by age.
#
# Read with docs/research/tree-age-carbon-rules.md (rationale, source list and the
# open questions behind every `pending` rule).
#
# Conventions
# - verification_status: verified = the source was opened and states the condition;
#   pending = not confirmed from a primary source (press only, or text not opened).
#   Pending rules MUST NOT be presented as confirmed and must fail a production-mode
#   data-quality check (CLAUDE.md principle 10).
# - `amount` is filled only when a source states it; every amount carries its as_of.
# - is_example: true marks a municipal rule that stands for "check your own local ordinance".
# - Estimates are not credits: nothing here converts a tree into a credit. Payments such as
#   the Haryana pension are "other farm income", never added to carbon value.
# - GCP (India Green Credits) and CCTS (India carbon credits) are separate mechanisms.
# - EU: an estimate is never automatically CRCF-certifiable.
#
# age_classes are a project convention for labels, not legal categories:
#   20 y = the split used by the IPCC for natural-forest growth (<=20 y and >20 y);
#   50 y = the heritage-tree age reported for Maharashtra (press; norms still pending);
#   75 y = the age threshold of Haryana's Pran Vayu Devta Pension Scheme (press; pending).
version: 0.1.0
updated: 2026-10-05
disclaimer: >-
  Screening information only — not legal advice. Rules change; confirm with the responsible authority before acting.
age_classes:            # project convention for labels (rationale in docs/research/tree-age-carbon-rules.md)
  - {id: young, label: "Young (0–20 years)", min_age: 0, max_age: 20}
  - {id: mature, label: "Mature (21–49 years)", min_age: 21, max_age: 49}
  - {id: old, label: "Old (50–74 years)", min_age: 50, max_age: 74}
  - {id: veteran, label: "Veteran (75+ years)", min_age: 75, max_age: null}
rules:
  # ------------------------------------------------------------------ GLOBAL standards
  - id: global-icvcm-ccp-additionality
    scope: GLOBAL
    country: null
    subdivision: null
    locality: null
    name: "ICVCM Core Carbon Principles 5-7: additionality, permanence, robust quantification"
    authority: "Integrity Council for the Voluntary Carbon Market (ICVCM)"
    category: methodology-note
    applies_to: {min_age_years: null, max_age_years: null, trees: any, setting: any}
    outcome_for_existing_trees: conditional
    summary: >-
      A carbon credit may only count removals that would not have happened without carbon revenue, so the growth that trees already standing would make anyway is not creditable on its own.
    details: >-
      Principle 5 (additionality): the emission reductions or removals 'shall be additional, i.e., they would not have occurred in the absence of the incentive created by carbon credit revenues.' Principle 6 (permanence): they 'shall be permanent or, where there is a risk of reversal, there shall be measures in place to address those risks and compensate reversals.' Principle 7: they 'shall be robustly quantified, based on conservative approaches, completeness and scientific methods.'
    amount: null
    status: in-force
    is_example: false
    sources:
      - {title: "Core Carbon Principles", publisher: "Integrity Council for the Voluntary Carbon Market", url: "https://icvcm.org/core-carbon-principles/", accessed: "2026-10-05"}
    verification_status: verified
    notes: >-
      The plain-language reading for existing trees (growth that happens anyway is not additional, which is why methodologies use baselines) is the Atlas's interpretation of Principle 5, not ICVCM text. See docs/concepts/additionality.md.

  - id: global-verra-vm0047-arr
    scope: GLOBAL
    country: null
    subdivision: null
    locality: null
    name: "Verra VM0047 Afforestation, Reforestation and Revegetation, v1.1"
    authority: "Verra (Verified Carbon Standard programme)"
    category: carbon-credit-eligibility
    applies_to: {min_age_years: null, max_age_years: null, trees: new-planting, setting: any}
    outcome_for_existing_trees: not-eligible
    summary: >-
      VM0047 credits trees that a project plants or restores; the carbon already stored in pre-existing trees is measured as a starting (t=0) stock and is not credited.
    details: >-
      Area-based approach: project land must not have met the definition of managed forest at any point in the 10 years immediately preceding the project start date, although v1.1 also allows enhancing forest carbon stocks where existing forest cover has not been managed for wood products in the past ten years. A t = 0 carbon-stock estimate is required for pre-existing woody biomass, and removal of that biomass is only allowed where it is treated as a waste product with no commercial value. Census-based approach (dispersed planting such as agroforestry): planting density must not exceed 50 planting units per hectare, only direct planting is allowed, the pre-project land use must be maintained, and the area must have less than 10% pre-existing woody biomass cover (or be under continuous cropping, 'settlements' or 'other lands').
    amount: null
    status: in-force
    is_example: false
    sources:
      - {title: "VM0047 Afforestation, Reforestation and Revegetation, v1.1 (methodology document)", publisher: "Verra", url: "https://verra.org/documents/vm0047-afforestation-reforestation-and-revegetation-v1-1/", accessed: "2026-10-05"}
      - {title: "VM0047 Afforestation, Reforestation and Revegetation, v1.1 (methodology page)", publisher: "Verra", url: "https://verra.org/methodologies/vm0047-afforestation-reforestation-and-revegetation-v1-1/", accessed: "2026-10-05"}
      - {title: "VM0047 v1.1: what you need to know (independent cross-check)", publisher: "Space Intelligence", url: "https://www.space-intelligence.com/vm0047-v-1-1-what-you-need-to-know/", accessed: "2026-10-05"}
    verification_status: verified
    notes: >-
      Version 1.1 is effective from 14 May 2025 (Verra methodology page). Section references (4.4.1(1), 4.2(2), 4.3, 8.2.1.2) were read through a page-summarising tool; the 10-year and 50-per-hectare figures were cross-checked against the Verra page and an independent summary. Quote from the PDF before any external publication.

  - id: global-gold-standard-luf-ar
    scope: GLOBAL
    country: null
    subdivision: null
    locality: null
    name: "Gold Standard Land Use & Forests Activity Requirements (A/R), v1.2.1, with A/R methodology v2.1"
    authority: "Gold Standard Foundation"
    category: carbon-credit-eligibility
    applies_to: {min_age_years: null, max_age_years: null, trees: new-planting, setting: non-forest}
    outcome_for_existing_trees: not-eligible
    summary: >-
      Gold Standard's afforestation and reforestation rules only cover planting on land that was not forest 10 years before the project start, so trees that already stand earn no credits.
    details: >-
      Activity Requirements v1.2.1 (April 2020), Section 2.1.1(b): 'The eligible area shall not meet the definition of forest 10 years before project start date and at project start date.' Credits are not issued for existing forests, improved forest management or avoided deforestation under these A/R requirements, and the A/R project start date is the earliest date when the first trees are planted. In A/R methodology v2.1 (16 May 2024, Section 3.5.1) the baseline is the 'tree' and 'non-tree' biomass present in the eligible planting area just prior to the planting start, and baseline trees are tracked inside the baseline.
    amount: null
    status: in-force
    is_example: false
    sources:
      - {title: "Land Use & Forests Activity Requirements, version 1.2.1 (A/R eligibility)", publisher: "Gold Standard Foundation", url: "https://globalgoals.goldstandard.org/standards/203_V1.2.1_AR_LUF-Activity-Requirements.pdf", accessed: "2026-10-05"}
      - {title: "Land Use & Forests A/R Methodology, version 2.1", publisher: "Gold Standard Foundation", url: "https://globalgoals.goldstandard.org/standards/403_V2.1_LUF_AR-Methodology-GHGs-emission-reduction-and-Sequestration-Methodology.pdf", accessed: "2026-10-05"}
      - {title: "Sustainable Transformation through Afforestation, Reforestation and Revegetation (STARR) consultation", publisher: "Gold Standard Foundation", url: "https://www.goldstandard.org/consultations/sustainable-transformation-afforestation-reforestation-revegetation-starr", accessed: "2026-10-05"}
    verification_status: verified
    notes: >-
      Gold Standard consulted on a successor framework, STARR, from 22 April to 22 May 2026; it also targets non-forest land. Final publication and whether it replaces the documents above were not confirmed. Plan Vivo (PV Climate) was reviewed but its public page does not state how existing trees are treated, so it has no rule here (see the md file).

  # ------------------------------------------------------------------ INDIA
  - id: in-gcp-tree-plantation
    scope: IN
    country: IN
    subdivision: null
    locality: null
    name: "Green Credit Programme: tree-plantation methodology (Green Credit Rules, 2023; revised 29 August 2025)"
    authority: "Ministry of Environment, Forest and Climate Change; administrator ICFRE"
    category: incentive-payment
    applies_to: {min_age_years: null, max_age_years: null, trees: new-planting, setting: forest}
    outcome_for_existing_trees: not-eligible
    summary: >-
      Green Credits for tree plantation are issued only for restoring degraded forest land of at least 5 ha under a State or UT Forest Department, so existing trees on a farm or in a town do not qualify.
    details: >-
      Eligible land is 'Degraded forest land parcels under the control and management of the State/UT Forest Department', each a compact area of at least 5 hectares free from encumbrances; wildlife sanctuaries, national parks and tiger reserves are excluded. Credit claims are possible 'After 5 years of restoration work and when canopy density reaches at least 40 percent'. Green Credits issued for tree plantation 'shall be non-tradable' and are non-transferable except between a holding company and its subsidiaries. The methodology was first notified on 22 February 2024 and revised on 29 August 2025.
    amount: null
    status: in-force
    is_example: false
    sources:
      - {title: "Green Credit Programme FAQ", publisher: "MoEFCC Green Credit Programme portal", url: "https://www.moefcc-gcp.in/faq", accessed: "2026-10-05"}
      - {title: "About the Green Credit Programme", publisher: "MoEFCC Green Credit Programme portal", url: "https://www.moefcc-gcp.in/about/aboutGCP", accessed: "2026-10-05"}
      - {title: "Green Credit Programme: Lok Sabha written reply, 16 March 2026", publisher: "Press Information Bureau, Government of India", url: "https://www.pib.gov.in/PressReleasePage.aspx?PRID=2240640&reg=3&lang=1", accessed: "2026-10-05"}
      - {title: "Green Credit Programme home page (notification list)", publisher: "MoEFCC Green Credit Programme portal", url: "https://www.moefcc-gcp.in/", accessed: "2026-10-05"}
    verification_status: verified
    notes: >-
      Green Credits are a government recognition scheme, not carbon credits (CCTS) and not a cash payment; 'incentive-payment' is the closest available category label. The Green Credit Rules were notified on 12 October 2023 under the Environment Protection Act, 1986 (GCP portal). Per-tree details such as one credit per surviving tree aged five years or more come from secondary sources listed in docs/research/policy-references.md and are not entered here.

  - id: in-ccts-offset-bm-fr05-002
    scope: IN
    country: IN
    subdivision: null
    locality: null
    name: "Carbon Credit Trading Scheme offset mechanism: BM FR05.002 Afforestation and reforestation of lands except wetlands, v1.0"
    authority: "Bureau of Energy Efficiency (BEE), Government of India"
    category: carbon-credit-eligibility
    applies_to: {min_age_years: null, max_age_years: null, trees: new-planting, setting: any}
    outcome_for_existing_trees: not-eligible
    summary: >-
      India's approved CCTS afforestation methodology credits net removals above a baseline that already counts the tree biomass standing before the project, so existing trees earn nothing on their own.
    details: >-
      BM FR05.002 (Version 1.0, 8 September 2025) is adopted from, and refers to, the UNFCCC CDM methodology AR-ACM0003. Baseline net GHG removals include the 'Change in carbon stock in baseline tree biomass' and baseline shrub biomass (Section 4.4, Equation 1), so pre-existing tree biomass sits in the baseline. Applicability (Section 3.2): the land must not be wetland, and soil disturbance must not cover more than 10 per cent of the area of organic-soil land or of land with baseline management practices. Credits are issued as temporary (tCCC) or long-term (lCCC) Carbon Credit Certificates (Section 4.8).
    amount: null
    status: in-force
    is_example: false
    sources:
      - {title: "BM FR05.002 Afforestation and reforestation of lands except wetlands, Version 1.0", publisher: "Bureau of Energy Efficiency", url: "https://beeindia.gov.in/sites/default/files/BM_FR05.002_Afforestation_and_reforestation_of_lands_except_wetlands.pdf", accessed: "2026-10-05"}
    verification_status: verified
    notes: >-
      The applicability text read is silent on agroforestry and cropland, so neither should be assumed eligible; ask BEE. CCTS is separate from the Green Credit Programme. No Carbon Credit Certificate trade or price signal was confirmed in this research (see docs/research/policy-references.md).

  - id: in-hr-pran-vayu-devta-pension
    scope: IN
    country: IN
    subdivision: IN-HR
    locality: null
    name: "Pran Vayu Devta Pension Scheme (Haryana)"
    authority: "Forest and Wildlife Department, Government of Haryana"
    category: incentive-payment
    applies_to: {min_age_years: 75, max_age_years: null, trees: existing, setting: non-forest}
    outcome_for_existing_trees: payment
    summary: >-
      Haryana pays the custodian of a living tree that is about 75 years old or more and stands outside forest land an annual pension, reported as Rs 3,000 per tree in 2025 and again in July 2026.
    details: >-
      Press reports of the June 2023 announcement describe a pension for trees 'older than 75 years' (later reports say 75 years or older); fallen, hollow, dead, dry or diseased trees and trees on forest land are excluded, and a grove grown from one seed (for example a banyan) counts as one tree. Later reports add that the tree must be one of 40 designated native species, that applicants apply to the district forest department (21-column proforma) and that a five-member district committee approves, with the pension paid to the custodian's bank account. The amount was reported as Rs 2,500 (June 2023), Rs 2,750 (July 2024) and Rs 3,000 (June to September 2025 and again on 13 July 2026), and is meant to rise each year in line with the Old Age Samman pension. A cap of 4,000 trees until a five-year review was reported in 2023, and 3,876 trees in 22 districts in September 2025.
    amount: {value: 3000, currency: INR, unit: "per tree per year", as_of: "2026-07"}
    status: in-force
    is_example: false
    sources:
      - {title: "Haryana to give Rs 2,500 annually to custodians of trees older than 75 years (23 June 2023)", publisher: "The Tribune", url: "https://www.tribuneindia.com/news/haryana/haryana-to-give-rs-2-500-annually-to-custodians-of-trees-older-than-75-years-says-minister-519354", accessed: "2026-10-05"}
      - {title: "Old Haryana trees: Rs 3,000 pension and the long red tape (6 September 2025)", publisher: "ThePrint", url: "https://theprint.in/ground-reports/old-haryana-trees-rs-3000-pension-and-the-long-red-tape/2737061/", accessed: "2026-10-05"}
      - {title: "51 trees in Faridabad aged 75 years are receiving an annual pension of Rs 3,000 (13 July 2026)", publisher: "Amar Ujala", url: "https://www.amarujala.com/delhi-ncr/faridabad/51-trees-in-faridabad-aged-75-years-are-receiving-an-annual-pension-of-3-000-2026-07-13", accessed: "2026-10-05"}
      - {title: "55 more trees in Karnal get heritage tag under Pran Vayu Devta scheme (12 June 2025)", publisher: "The Tribune", url: "https://www.tribuneindia.com/news/haryana/55-more-trees-in-karnal-get-heritage-tag-under-pran-vayu-devta-scheme/amp", accessed: "2026-10-05"}
      - {title: "Haryana's Pran Vayu Devta Yojana (2 July 2024)", publisher: "OneIndia", url: "https://www.oneindia.com/india/haryanas-pran-vayu-devta-yojana-financial-aid-for-elderly-tree-care-011-3863365.html", accessed: "2026-10-05"}
      - {title: "Message from PCCF's Desk (acknowledges the scheme; no amount or age)", publisher: "Haryana Forest Department", url: "https://haryanaforest.gov.in/message-from-pccfs-desk/", accessed: "2026-10-05"}
    verification_status: pending
    notes: >-
      Press only: the single official page found (Haryana Forest Department, PCCF message) names the scheme but gives no amount or age, the haryana.gov.in scheme page returned 404 and the Chief Minister's Office page was blocked to the fetch tool. Still needed: the official notification or guidelines to confirm the age wording (above or at least 75), the species list, exclusions and the current annual amount (it is indexed to the Old Age Samman pension). The as_of date is the latest press report quoting Rs 3,000 (an official, the Faridabad District Forest Officer, is quoted in it).

  - id: in-mh-heritage-tree
    scope: IN
    country: IN
    subdivision: IN-MH
    locality: null
    name: "Heritage trees under the Maharashtra (Urban Areas) Protection and Preservation of Trees Act, 1975, as amended in 2021"
    authority: "Maharashtra State Tree Authority and urban Tree Authorities; Government of Maharashtra"
    category: tree-protection
    applies_to: {min_age_years: 50, max_age_years: null, trees: existing, setting: urban}
    outcome_for_existing_trees: protected
    summary: >-
      In Maharashtra's urban areas a tree can be categorised as a heritage tree and a proposal to fell one goes to the State Tree Authority; news reports put the age at 50 years or more, but the amended Act leaves the norms to the Government.
    details: >-
      The 2021 amendment defines 'heritage tree' as 'a tree categorised as such by the Tree Authority, in accordance with the norms as may be notified by the Government' and sends a proposal to fell a heritage tree to the Maharashtra State Tree Authority (Section 2 and the proviso to Section 8(3)). The Bill and Act text opened here state no age; news reports of the June 2021 Cabinet decision say 'any tree with an estimated age of 50 years or above' would be classified as a heritage tree. The Tree Officer determines a tree's age 'as per the criteria and method as may be notified by the Government' (Section 8(5)(b)).
    amount: null
    status: in-force
    is_example: false
    sources:
      - {title: "Bill No. VIII of 2021, a Bill further to amend the Maharashtra (Urban Areas) Protection and Preservation of Trees Act, 1975", publisher: "Maharashtra Legislature", url: "https://mls.org.in/assembly-bill/one-house/Bill%20no%208%20of%202021%20Eng.%20One%20House.pdf", accessed: "2026-10-05"}
      - {title: "Maharashtra (Urban Areas) Protection and Preservation of Trees (Amendment) Act, 2021 (text)", publisher: "Legitquest", url: "https://www.legitquest.com/act/maharashtra-urban-areas-protection-and-preservation-of-trees-amendment-act-2021/A265", accessed: "2026-10-05"}
      - {title: "Now Maharashtra to give 50-year-old urban trees heritage tag (11 June 2021)", publisher: "The Tribune", url: "https://www.tribuneindia.com/news/schools/now-maharashtra-to-give-50-year-old-urban-trees-heritage-tag-266830", accessed: "2026-10-05"}
      - {title: "More than 50 years old tree will be declared as a heritage tree in Maharashtra", publisher: "Mumbai Live", url: "https://www.mumbailive.com/en/environment/more-than-50-years-old-tree-will-be-declared-as-a-heritage-tree-in-maharashtra-65671", accessed: "2026-10-05"}
      - {title: "Reply by Respondent 1 in OA No. 92/2024 (quotes the 2021 Amendment Act, State Tree Authority)", publisher: "National Green Tribunal", url: "https://www.greentribunal.gov.in/sites/default/files/news_updates/Reply%20by%20R-1%20in%20OA%20No.92-2024%20(page%20nos.10-88).pdf", accessed: "2026-10-05"}
    verification_status: pending
    notes: >-
      The 50-year threshold appears only in press reports (The Tribune, 11 June 2021; Mumbai Live) and is the basis of the 'old' age class; the Bill and the Act text opened leave heritage norms to be notified. Still needed: the Government notification of heritage-tree norms (Environment and Climate Change Department) or the consolidated Act on India Code (that PDF is blocked to the fetch tool). The NGT reply confirms the 2021 Amendment Act and the State Tree Authority (Section 3(1)) are on the statute book.

  - id: in-mh-compensatory-planting-estimated-age
    scope: IN
    country: IN
    subdivision: IN-MH
    locality: null
    name: "Compensatory planting equal to the felled tree's estimated age (Maharashtra Trees Act, Section 8, as amended 2021)"
    authority: "Tree Officer and Tree Authorities, Government of Maharashtra"
    category: compensatory-planting
    applies_to: {min_age_years: null, max_age_years: null, trees: existing, setting: urban}
    outcome_for_existing_trees: conditional
    summary: >-
      To be allowed to fell a tree in a Maharashtra urban area you must plant as many trees as the felled tree's estimated age in years, so a 60-year-old tree means 60 new trees.
    details: >-
      Section 8(5), as amended in 2021: the applicant 'shall plant such number of trees equal to the estimated age of the tree being felled and such trees to be planted shall be of atleast six feet height'. The Tree Officer determines the age 'as per the criteria and method as may be notified by the Government'; the Bill text also requires the planted trees to survive for a minimum of seven years (Section 8(5A)) and offers a deposit of not less than the valuation of the felled trees as an alternative. The penalty under Section 21 is the valuation of the tree, using a methodology to be notified, but not more than one lakh rupees, and applications covering more than two hundred trees of age five years or more are referred to the Maharashtra State Tree Authority.
    amount: null
    status: in-force
    is_example: false
    sources:
      - {title: "Bill No. VIII of 2021, a Bill further to amend the Maharashtra (Urban Areas) Protection and Preservation of Trees Act, 1975", publisher: "Maharashtra Legislature", url: "https://mls.org.in/assembly-bill/one-house/Bill%20no%208%20of%202021%20Eng.%20One%20House.pdf", accessed: "2026-10-05"}
      - {title: "Maharashtra (Urban Areas) Protection and Preservation of Trees (Amendment) Act, 2021 (text)", publisher: "Legitquest", url: "https://www.legitquest.com/act/maharashtra-urban-areas-protection-and-preservation-of-trees-amendment-act-2021/A265", accessed: "2026-10-05"}
    verification_status: verified
    notes: >-
      The number of trees equals the estimated age (it is not a fixed ratio), so the rule scales with tree age. The seven-year survival period and the deposit alternative are taken from the Bill as introduced; check the enacted text. A press report (Mumbai Live) adds 6-8 ft planting height and geotagging, which were not found in the Act text.

  - id: in-ka-preservation-of-trees-act
    scope: IN
    country: IN
    subdivision: IN-KA
    locality: null
    name: "Karnataka Preservation of Trees Act, 1976"
    authority: "Karnataka Forest Department (Tree Officer)"
    category: tree-protection
    applies_to: {min_age_years: null, max_age_years: null, trees: existing, setting: any}
    outcome_for_existing_trees: protected
    summary: >-
      Where the Act applies, felling a tree needs the Tree Officer's previous permission and the applicant must plant replacement trees; the Act sets no age test.
    details: >-
      Section 8: 'no person shall fell any tree or cause any tree to be felled in any land ... except with the previous permission of the Tree Officer'; a 'tree' is a woody plant whose trunk is not less than five and a half centimetres in diameter and not less than one metre in height (Section 2). Permission must be granted for trees that are dead, diseased or wind-fallen, silviculturally mature, a danger to life or property, an obstruction to traffic or substantially damaged by natural causes (Section 8(3)), and listed species such as casuarina, coconut, rubber and bamboo are exempt (Section 8(7)). Where permission is given the applicant 'shall plant another tree or trees of the same or any other suitable species on the same site or other suitable place within thirty days'. The Act extends to the whole of Karnataka, but its provisions were brought into force area by area through notifications (Section 1).
    amount: null
    status: in-force
    is_example: false
    sources:
      - {title: "The Karnataka Preservation of Trees Act, 1976 (Karnataka Act 76 of 1976)", publisher: "PRS Legislative Research (copy of the Act)", url: "https://prsindia.org/files/bills_acts/acts_states/karnataka/1976/1976KR76.pdf", accessed: "2026-10-05"}
    verification_status: verified
    notes: >-
      Text is the 1976 Act as published by PRS India. Later amendments, the list of notified areas and the current penalty (1976 text, Section 22: up to three months' imprisonment or a fine up to Rs 1,000, or both) were not checked, and the India Code copy is blocked to the fetch tool. Karnataka's Krushi Aranya Protsaha Yojane (a new-planting incentive, not age-based) is covered in the md file and not entered as a rule because its amounts are unconfirmed.

  - id: in-dl-preservation-of-trees-act
    scope: IN
    country: IN
    subdivision: IN-DL
    locality: null
    name: "Delhi Preservation of Trees Act, 1994"
    authority: "Department of Forests & Wildlife, Government of NCT of Delhi (Tree Officer)"
    category: tree-protection
    applies_to: {min_age_years: null, max_age_years: null, trees: existing, setting: urban}
    outcome_for_existing_trees: protected
    summary: >-
      In Delhi, felling, removing or disposing of a tree needs the Tree Officer's previous permission; the Act has no age test and covers a woody plant once its trunk is at least 5 cm across at 30 cm height and it is at least 1 m tall.
    details: >-
      Section 8: 'no person shall fell or remove or dispose of any tree or forest produce in any land ... except with the previous permission of the Tree Officer'; a 'tree' is a woody plant whose trunk is not less than five centimetres in diameter at a height of thirty centimetres from the ground and which is not less than one metre in height (Section 2). Section 9(2) lists cases where permission cannot be refused, including dead, diseased or wind-fallen trees, silviculturally mature trees (except on steep slopes) and trees that endanger life, property or traffic. The Tree Officer must decide within 60 days (otherwise permission is deemed granted) and applicants state the girth at 1.85 m above ground (Section 9(1)). A person given permission must plant the number and kind of trees the Tree Officer directs in the area where the tree was felled (Section 10).
    amount: null
    status: in-force
    is_example: false
    sources:
      - {title: "The Delhi Preservation of Trees Act, 1994", publisher: "India Code (Government of India)", url: "https://www.indiacode.nic.in/bitstream/123456789/13589/1/the_delhi_preservation_of_trees_act_1994.pdf", accessed: "2026-10-05"}
    verification_status: verified
    notes: >-
      The Act text read has no heritage-tree or age provision. Penalty in that text (Section 24): up to one year's imprisonment or a fine up to Rs 1,000, or both; amendments and the current consolidated text were not checked.

