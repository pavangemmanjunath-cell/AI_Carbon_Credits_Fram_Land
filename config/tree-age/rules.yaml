    category: carbon-credit-eligibility
    applies_to: {min_age_years: null, max_age_years: null, trees: existing, setting: forest}
    outcome_for_existing_trees: conditional
    summary: >-
      ACR credits the extra live and dead biomass carbon a non-federal forest keeps compared with a harvest baseline; it sets no stand-age test and does not credit existing carbon stock as such.
    details: >-
      Emission Reduction Tons are quantified from forgone baseline timber harvests and from removals through retention of with-project forest growth against a project-specific harvesting baseline (Sections 1.1 and 4.1). The project must demonstrate 'an increase in with-project live biomass carbon and dead wood pools, in sum, relative to those pools in the baseline scenario by the end of the Crediting Period' (Section 1.2). Eligible land is non-federal forest where the controlling entity can legally harvest and holds clear title or timber rights; no explicit age requirement appears in the eligibility text, but the baseline uses 'financially mature timber (i.e., at least as old as the optimal rotation age)' (Section 4.1.4). The minimum project term is 40 years and the crediting period 20 years with possible renewal (Section 2.2).
    amount: null
    status: in-force
    is_example: false
    sources:
