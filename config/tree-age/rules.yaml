    verification_status: verified
    notes: >-
      Municipal example only: other German cities have their own Baumschutzsatzung with different thresholds. The ordinance text itself could not be read (the umwelt-online.de copy was unreadable), so details come from the Berlin service portal and a district office page, which also name the legal basis (BNatSchG sections 29(1) and 39(5) no. 2, BaumSchVO section 5, NatSchG Bln).
