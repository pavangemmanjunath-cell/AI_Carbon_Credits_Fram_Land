# ISO 3166-2 subdivisions used by the tree-age rules (state / union territory / Land).
#
# Codes are exact ISO 3166-2 codes (ISO Online Browsing Platform, https://www.iso.org/obp; the list
# was cross-checked against the Debian iso-codes package, version 4.16.0). Names are the English
# names with diacritics removed, except German names, which keep their umlauts. Examples of codes
# that differ from habit: Odisha is IN-OD (not IN-OR), Chhattisgarh IN-CG, Telangana IN-TS,
# Uttarakhand IN-UK, and Dadra and Nagar Haveli and Daman and Diu is the single territory IN-DH.
#
# Only the countries that have a subdivision-specific tree-age rule today are listed: India and the
# United States (the Atlas's MVP countries) and Germany (the Berlin example in rules.yaml). Add
# another country by adding a block; a rule's `subdivision` must exist here (checked in
# tests/data-quality/test_tree_age_rules.py). Nothing here is a legal or administrative boundary;
# it only labels the places a rule names. An optional `article: the` on a country block is used
# only to write plain sentences ("Applies in the United States ...").
version: 0.1.0
updated: 2026-10-05
