# Species table v0.1 — parameters for the tree-biomass model
#
# Every numeric parameter carries source + verification_status (see CLAUDE.md).
# wood density: Zanne et al. 2009 Global Wood Density Database (Dryad) — values
# below are working values and MUST be verified against the database export.
# growth_group selects the broad Tier 1 increment class; `increment_multiplier`
# adjusts it for the species (assumption unless cited).
version: 0.1.0
species:
  - id: mango
    scientific_name: Mangifera indica
    common_name: Mango
    group: broadleaf_tropical_fruit
    regions: [IN]
    suitable_climate_zones: [tropical_dry, tropical_moist, tropical_wet, subtropical_humid, subtropical_dry]
    reference_density_per_ha: {value: 150, source: "typical 8 m × 8 m orchard spacing; project assumption v0.1", verification_status: assumption}
    max_density_per_ha: 600
    maturity_years: 8
    typical_height_m_at_maturity: {value: 10, source: project assumption v0.1, verification_status: assumption}
    wood_density_g_cm3: {value: 0.55, source: "Zanne et al. 2009 GWDD (working value)", verification_status: pending}
    increment_multiplier: {value: 0.9, source: "fruit orchards pruned/managed below natural stand increment; project assumption v0.1", verification_status: assumption}
    allometry: pantropical_chave_2014_with_height
    notes: Fruit income is reported separately; timber not applicable.
  - id: teak
    scientific_name: Tectona grandis
    common_name: Teak
    group: broadleaf_tropical_timber
    regions: [IN]
