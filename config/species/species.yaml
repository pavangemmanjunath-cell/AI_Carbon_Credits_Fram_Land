    maturity_years: 20
    typical_height_m_at_maturity: {value: 20, source: project assumption v0.1, verification_status: assumption}
    wood_density_g_cm3: {value: 0.55, source: "Zanne et al. 2009 GWDD (working value)", verification_status: pending}
    increment_multiplier: {value: 1.1, source: "IPCC 2006 Table 4.10 lists Tectona grandis plantations separately — verify and replace multiplier with the table value", verification_status: pending}
