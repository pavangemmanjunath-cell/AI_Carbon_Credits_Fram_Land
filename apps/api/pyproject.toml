[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "carboncreditbuy-api"
version = "1.1.1"
description = "CarbonCreditBuy — FastAPI back end (scenario estimates, never credits)"
readme = "README.md"
requires-python = ">=3.12"
license = {text = "Apache-2.0"}
dependencies = [
  "fastapi>=0.115",
  "uvicorn[standard]>=0.30",
  "pydantic>=2.9,<3",
  "pydantic-settings>=2.5",
  "slowapi>=0.1.9",
  "python-multipart>=0.0.9",
  "shapely>=2.0",
  "pyproj>=3.6",
  "numpy>=1.26",
  "httpx>=0.27",
  "PyYAML>=6.0",
  "Jinja2>=3.1",
  "jsonschema>=4.21",
]

[project.optional-dependencies]
live = ["rasterio>=1.3", "pystac-client>=0.8"]
postgres = ["psycopg[binary]>=3.1"]
pdf = ["weasyprint>=62"]

[tool.setuptools.packages.find]
include = ["app*"]
